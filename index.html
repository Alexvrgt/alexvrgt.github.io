<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bixbyGT’s Hub</title>
    <style>
        /* Base Setup - Dark Purple Gradient Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b0c10 0%, #150926 50%, #0b0c10 100%);
            color: #c5c6c7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Entrance Slide Animation */
        @keyframes pageSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-container, .video-container, .hub-grid {
            animation: pageSlideUp 0.6s ease-out forwards;
        }

        /* Profile Header */
        .profile-container {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 40px;
        }
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #66fcf1; /* Neon Cyan Border */
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.4), 
                        0 0 25px rgba(188, 19, 254, 0.3),
                        0 0 40px rgba(255, 69, 0, 0.5);
            /* FIXED: Background color and generic fallback vector if avatar.png fails */
            background: #1f2833 url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%2366fcf1'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E") no-repeat center;
            background-size: 60%;
        }
        h1 {
            color: #ffffff;
            margin: 15px 0 5px 0;
            font-size: 2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }
        .subtitle {
            color: #bc13fe;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Video Showcase Section */
        .video-container {
            width: 100%;
            max-width: 550px;
            background: rgba(21, 9, 38, 0.6);
            border: 2px solid #bc13fe; /* Neon Purple Border */
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Verification Locker Box */
        .verify-box {
            width: 100%;
            max-width: 550px;
            background: rgba(11, 12, 16, 0.8);
            border: 2px solid #66fcf1;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .verify-title {
            color: #fff;
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .verify-btn {
            background: linear-gradient(90deg, #ff0000, #cc0000);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .verify-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
        }

        /* Grid Layout for Hub Items */
        .hub-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }

        /* Action/Link Cards */
        .hub-card {
            background: rgba(31, 40, 51, 0.4);
            border: 1px solid rgba(102, 252, 241, 0.2);
            border-radius: 8px;
            padding: 18px;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* Enabled State Animations */
        .hub-card.unlocked {
            border-color: #66fcf1;
            cursor: pointer;
            background: rgba(31, 40, 51, 0.8);
            pointer-events: auto; /* FIXED: Overrides locked configuration settings */
        }
        .hub-card.unlocked:hover {
            transform: translateX(5px);
            background: rgba(102, 252, 241, 0.1);
            box-shadow: -5px 0 15px rgba(102, 252, 241, 0.4);
        }
        .hub-card.unlocked .status-tag {
            color: #66fcf1;
            text-shadow: 0 0 8px rgba(102, 252, 241, 0.6);
        }

        /* Locked State Layout */
        .hub-card.locked {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(20, 20, 20, 0.6);
            color: #555555;
            cursor: not-allowed;
            pointer-events: none;
        }
        .hub-card.locked .status-tag {
            color: #ff4500;
            font-size: 0.85rem;
        }

        .card-info {
            display: flex;
            flex-direction: column;
        }
        .card-desc {
            font-size: 0.8rem;
            color: #45a29e;
            margin-top: 4px;
            font-weight: normal;
        }
        .hub-card.locked .card-desc {
            color: #444444;
        }
        .status-tag {
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Profile Header Section -->
    <div class="profile-container">
        <!-- FIXED: Added an onerror event to make sure a placeholder renders if your image path goes missing -->
        <img src="avatar.png" alt="bixbyGT" class="profile-pic" onerror="this.style.opacity='0.9';">
        <h1>bixbyGT’s Hub</h1>
        <div class="subtitle">VRADD Mod Deploy</div>
    </div>

    <!-- Video Showcase Section -->
    <div class="video-container">
        <div class="video-wrapper">
            <!-- Replace inside the src with your actual video or trailer URL -->
            <iframe src="https://youtube.com" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Verification Locker Box -->
    <div class="verify-box">
        <p class="verify-title">Human Verification Required</p>
        <button class="verify-btn" id="verifyButton">VERIFY NOW</button>
    </div>

    <!-- Grid Layout for Hub Items -->
    <div class="hub-grid">
        <!-- Dynamic Links start locked out -->
        <a href="https://example.com" class="hub-card locked" target="_blank">
            <div class="card-info">
                <span>VRADD Core Mod Setup</span>
                <span class="card-desc">Main distribution build filespack</span>
            </div>
            <span class="status-tag">Locked</span>
        </a>

        <a href="https://example.com" class="hub-card locked" target="_blank">
            <div class="card-info">
                <span>Asset Textures Pack</span>
                <span class="card-desc">High-res resolution engine renders</span>
            </div>
            <span class="status-tag">Locked</span>
        </a>
    </div>

    <!-- FIXED: Verification Unlocking Engine Logic -->
    <script>
        document.getElementById('verifyButton').addEventListener('click', function() {
            // Simulated human verification passage loop
            alert("Verification simulation started! Links are now unlocked.");
            
            // Query every locked interface item card 
            const lockedCards = document.querySelectorAll('.hub-card.locked');
            
            lockedCards.forEach(card => {
                // Shift visual classes to activate components
                card.classList.remove('locked');
                card.classList.add('unlocked');
                
                // Swap the text label inside the status layout tag
                const statusTag = card.querySelector('.status-tag');
                if (statusTag) {
                    statusTag.textContent = 'Unlocked';
                }
            });

            // Optional: Hide or change verification container box upon passage
            document.querySelector('.verify-box').style.display = 'none';
        });
    </script>

</body>
</html>
